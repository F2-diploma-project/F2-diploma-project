                        description: Термін придатності спливає завтра.
                        category: Молочні продукти
                        base_price_minor: 3800
                        currency: UAH
                        quantity: 12
                        pickup_from: '2026-10-10T18:30:00+03:00'
                        pickup_to: '2026-10-10T22:00:00+03:00'
                        allergens: [milk]
                        photo_url: null
                        is_bundle: false
                        bundle_items: []
                        status: active
                        updated_at: '2026-10-10T18:28:00+03:00'
                    next_cursor: null
                    server_time: '2026-10-10T18:30:00+03:00'
                empty:
                  summary: Змін немає
                  value:
                    items: []
                    next_cursor: null
                    server_time: '2026-10-10T18:30:30+03:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/lots/{lotId}:
    get:
      tags: [Lots]
      operationId: getLot
      security:
        - ApiKeyAuth: []
      summary: Актуальний стан і залишок одного лота (допоміжний виклик)
      description: |
        Допоміжний, необов'язковий виклик: ті самі дані B2C-модуль отримує з фіду.

        [ДО УЗГОДЖЕННЯ з B2C-модулем] B2C-модуль може викликати перед бронюванням або
        автовикупом (крок 3), щоб переконатися, що лот активний і залишку
        достатньо — наприклад, якщо касир щойно списав товар у POS.
        Результат не резервує товар: резервування лишається на боці B2C-модуля,
        а остаточна перевірка залишку відбувається в `POST /v1/orders`.
      x-agreement-status: pending
      parameters:
        - $ref: '#/components/parameters/LotId'
      responses:
        '200':
          description: Лот знайдено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lot'
              examples:
                active:
                  $ref: '#/components/examples/LotCroissants'
                bundle:
                  $ref: '#/components/examples/LotBundle'
                soldOut:
                  $ref: '#/components/examples/LotSoldOut'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/LotNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/orders:
    post:
      tags: [Orders]
      operationId: confirmOrder
      security:
        - ApiKeyAuth: []
      summary: Підтвердження покупки «лот викуплено» (крок 4)
      description: |
        B2C-модуль повідомляє, що клієнт оплатив (або автовикуп спрацював) певну
        кількість одиниць лота. B2B-система зменшує залишок і генерує код
        підтвердження та QR.

        **Повторні запити (ідемпотентність).** `order_id` — номер замовлення
        B2C-модуля. Повторний запит з тим самим `order_id` і тими самими даними
        не зменшує залишок удруге і повертає `200` з тим самим результатом.
        Той самий `order_id` з іншими даними — `409 ORDER_ID_CONFLICT`.

        **Резервування.** Одиниці лота B2C-модуль резервує у себе до цього виклику
        (наприклад, через `SELECT ... FOR UPDATE SKIP LOCKED` у власній БД);
        B2B-система зменшує залишок лише під час підтвердження і сама перевіряє,
        що його достатньо (`409 INSUFFICIENT_QUANTITY`).

        [ДО УЗГОДЖЕННЯ з B2C-модулем] Купівля за кількістю (`quantity`);
        смарт-бандл купується як один лот, `quantity` — кількість бандлів.
        Фінальна ціна (`unit_price_minor`) потрібна B2B-системі для аналітики
        відновленого доходу. Ланцюг ціни: `base_price_minor` (фід B2B-системи) →
        динамічне ціноутворення Price Decay (B2C-модуль) → `unit_price_minor`
        (цей виклик).
      x-agreement-status: pending
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderConfirmationRequest'
            example:
              order_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
              lot_id: 3f2b8c1e-9a4d-4e7b-b1c2-5d6e7f8a9b0c
              quantity: 2
              unit_price_minor: 2700
              currency: UAH
              purchased_at: '2026-10-10T19:05:12+03:00'
      responses:
        '201':
          description: Покупку підтверджено вперше, залишок зменшено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderConfirmation'
              examples:
                confirmed:
                  $ref: '#/components/examples/OrderConfirmed'
        '200':
          description: Повторний запит з тим самим `order_id` — повертається попередній результат, залишок не змінюється.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderConfirmation'
              examples:
                confirmed:
                  $ref: '#/components/examples/OrderConfirmed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/LotNotFound'
        '409':
          description: Покупку неможливо підтвердити через стан лота або конфлікт номера замовлення.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficientQuantity:
                  summary: Залишку не вистачає
                  value:
                    code: INSUFFICIENT_QUANTITY
                    message: Requested quantity exceeds available quantity.
                    details:
                      lot_id: 3f2b8c1e-9a4d-4e7b-b1c2-5d6e7f8a9b0c
                      requested: 2
                      available: 1
                lotNotAvailable:
                  summary: Лот знято з продажу або розпродано
                  value:
                    code: LOT_NOT_AVAILABLE
                    message: Lot is not active.
                    details:
                      lot_id: 3f2b8c1e-9a4d-4e7b-b1c2-5d6e7f8a9b0c
                      status: withdrawn
                orderIdConflict:
                  summary: Той самий order_id з іншими даними
                  value:
                    code: ORDER_ID_CONFLICT
                    message: Order already exists with different data.
                    details:
                      order_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        '422':
          description: Дані коректні за форматом, але суперечать правилам (наприклад, неправильна валюта або час видачі минув).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                currencyMismatch:
                  summary: Валюта не збігається з валютою лота
                  value:
                    code: CURRENCY_MISMATCH
                    message: Currency must match lot currency.
                    details:
                      expected: UAH
                      received: EUR
                pickupWindowClosed:
                  summary: Час видачі вже минув
                  value:
                    code: PICKUP_WINDOW_CLOSED
                    message: Pickup window for this lot has ended.
                    details:
                      pickup_to: '2026-10-10T21:00:00+03:00'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/orders/{orderId}/qr:
    get:
      tags: [Orders]
      operationId: getOrderQr
      security:
        - ApiKeyAuth: []
      summary: QR-код і текстовий код підтвердження за номером замовлення (крок 5)
      description: |
        B2B-система повертає готовий QR (картинка PNG у base64) із токеном довжиною 256 біт і короткий
        код для візуальної звірки касиром. Застосунок B2C-модуля лише показує їх клієнту. Виклик можна
        повторювати: токен обчислюється з номера замовлення, тому повертається той самий QR-код.
      parameters:
        - name: orderId
          in: path
          required: true
          description: Номер замовлення B2C-модуля (той самий `order_id`, що в `POST /v1/orders`).
          schema:
            type: string
            format: uuid
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
      responses:
        '200':
          description: QR знайдено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderQr'
              example:
                order_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                confirmation_code: K7Q-4M2
                status: awaiting_pickup
                qr_image:
                  mime_type: image/png
                  data_base64: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==
                pickup_from: '2026-10-10T19:00:00+03:00'
                pickup_to: '2026-10-10T21:00:00+03:00'
                venue:
                  id: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                  name: Кав'ярня «Ранок»
                  address: Київ, вул. Хрещатик, 10
                  location:
                    lat: 50.4475
                    lng: 30.5222
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Замовлення з таким номером не підтверджувалось через `POST /v1/orders`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ORDER_NOT_FOUND
                message: Order not found.
                details:
                  order_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access-токен JWT, підписаний за алгоритмом RS256, строк дії не більше 15 хв. Токени з `alg: none`
        відхиляються. Claims: `sub` (ідентифікатор користувача), `venue_id`, `role` (`admin` або `cashier`), `exp`, `iat`.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Ключ B2C-модуля. На сервері зберігається лише SHA-256 від значення ключа; відкликання ключа
        не потребує зупинки системи.

  headers:
    CorrelationId:
      description: Кореляційний ідентифікатор запиту для структурованих логів.
      schema:
        type: string
        maxLength: 64
    RetryAfter:
      description: Кількість секунд до наступної допустимої спроби.
      schema:
        type: integer
        minimum: 1

  parameters:
    LotId:
      name: lotId
      in: path
      required: true
      description: Ідентифікатор лота.
      schema:
        type: string
        format: uuid
      example: 3f2b8c1e-9a4d-4e7b-b1c2-5d6e7f8a9b0c
    StaffId:
      name: staffId
      in: path
      required: true
      description: Ідентифікатор облікового запису працівника.
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      description: Ідентифікатор категорії.
      schema:
        type: string
        format: uuid
    MenuItemId:
      name: menuItemId
      in: path
      required: true
      description: Ідентифікатор позиції меню.
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      description: Ідентифікатор завдання розпізнавання.
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      description: Ідентифікатор розпізнаної позиції.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Невірний формат запиту (наприклад, не UUID, неправильна дата або порушення обмежень полів).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: Request validation failed.
            details:
              fields:
                - field: quantity
                  issue: must be an integer >= 1
    Unauthorized:
      description: Токен або ключ відсутній, недійсний чи прострочений.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Missing or invalid credentials.
    Forbidden:
      description: Роль користувача не має доступу до операції.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: Role is not allowed to perform this operation.
    NotFound:
      description: Ресурс не існує або належить іншому закладу.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Resource not found.
    LotNotFound:
      description: Лот з таким ідентифікатором не існує.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: LOT_NOT_FOUND
            message: Lot not found.
            details:
              lot_id: 3f2b8c1e-9a4d-4e7b-b1c2-5d6e7f8a9b0c
    CategoryNameTaken:
      description: Категорія з такою назвою вже існує в закладі.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: CATEGORY_NAME_TAKEN
            message: Category name is already in use.
    InvalidStateTransition:
      description: Перехід неможливий із поточного статусу лота.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_STATE_TRANSITION
            message: Transition from status active to active is not allowed.
            details:
              current: active
    TooManyRequests:
      description: Перевищено ліміт 100 запитів за хвилину.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RATE_LIMITED
            message: Rate limit exceeded.
            details:
              retry_after_seconds: 23
    InternalError:
      description: Непередбачена помилка на боці B2B. Запит можна повторити пізніше.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: Unexpected server error.
    ServiceUnavailable:
      description: Залежність (PostgreSQL, Redis або об'єктне сховище) тимчасово недоступна.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: SERVICE_UNAVAILABLE
            message: A required dependency is unavailable.

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Машинний код помилки.
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - INVALID_CREDENTIALS
            - ACCOUNT_LOCKED
            - INVALID_REFRESH_TOKEN
            - LOGIN_TAKEN
            - CATEGORY_NAME_TAKEN
            - CATEGORY_NOT_EMPTY
            - INVALID_IMAGE
            - IMAGE_TOO_LARGE
            - ITEM_ALREADY_REVIEWED
            - VERSION_CONFLICT
            - INVALID_STATE_TRANSITION
            - LOT_NOT_FOUND
            - ORDER_NOT_FOUND
            - INSUFFICIENT_QUANTITY
            - LOT_NOT_AVAILABLE
            - ORDER_ID_CONFLICT
            - CURRENCY_MISMATCH
            - PICKUP_WINDOW_CLOSED
            - TOKEN_NOT_FOUND
            - TOKEN_ALREADY_USED
            - TOKEN_EXPIRED
            - RATE_LIMITED
            - SERVICE_UNAVAILABLE
            - INTERNAL_ERROR
        message:
          type: string
          description: Пояснення для розробника (англійською), не для показу користувачу.
        details:
          type: object
          description: Додаткові дані про помилку.
          additionalProperties: true

    LoginRequest:
      type: object
      required: [login, password]
      additionalProperties: false
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '^[A-Za-z0-9._-]+$'
        password:
          type: string
          minLength: 12
          maxLength: 128
          format: password

    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 20
          maxLength: 2048

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: JWT (RS256).
        refresh_token:
          type: string
          description: Непрозорий токен; на сервері зберігається лише його SHA-256.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          minimum: 1
          maximum: 900
          description: Строк дії access-токена в секундах.

    Staff:
      type: object
      required: [id, login, role, is_active, created_at]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        role:
          type: string
          enum: [admin, cashier]
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    CreateCashierRequest:
      type: object
      required: [login, password]
      additionalProperties: false
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '^[A-Za-z0-9._-]+$'
        password:
          type: string
          minLength: 12
          maxLength: 128
          format: password

    CategoryInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100

    CategoryPairs:
      type: object
      required: [pairs]
      additionalProperties: false
      properties:
        pairs:
          type: array
          maxItems: 500
          items:
            type: object
            required: [category_a_id, category_b_id]
            additionalProperties: false
            properties:
              category_a_id:
                type: string
                format: uuid
              category_b_id:
                type: string
                format: uuid
      example:
        pairs:
          - category_a_id: 1c4b6f0e-6d9e-4d52-9a0b-7d2b5f1c3a10
            category_b_id: 9e3d2a77-5b1c-4c8e-8f6d-0a4b7c2e1d55

    Allergens:
      type: array
      description: Алергени для маркування; порожній масив означає, що алергенів не виявлено.
      maxItems: 20
      items:
        type: string
        minLength: 1
        maxLength: 50

    MenuItemInput:
      type: object
      required: [name, category_id, base_price_minor]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        category_id:
          type: string
          format: uuid
        base_price_minor:
          type: integer
          minimum: 1
          maximum: 10000000
        allergens:
          $ref: '#/components/schemas/Allergens'

    MenuItemPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        category_id:
          type: string
          format: uuid
        base_price_minor:
          type: integer
          minimum: 1
          maximum: 10000000
        allergens:
          $ref: '#/components/schemas/Allergens'

    MenuItem:
      type: object
      required: [id, name, category_id, base_price_minor, allergens, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category_id:
          type: string
          format: uuid
        base_price_minor:
          type: integer
          minimum: 1
        allergens:
          $ref: '#/components/schemas/Allergens'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RecognitionJobStatus:
      type: string
      description: |
        - `queued` — завдання в черзі.
        - `processing` — виконується обробка.
        - `completed` — усі позиції оброблено.
        - `needs_review` — є позиції з `confidence` меншою за 0,7, що очікують рішення працівника.
        - `failed` — обробку завершено з помилкою; причина в `error_code`.
      enum: [queued, processing, completed, failed, needs_review]

    RecognitionJobAccepted:
      type: object
      required: [job_id, status]
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued]

    RecognitionItem:
      type: object
      required: [id, position, name, quantity, confidence, review_status, lot_id]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 1
        name:
          type: string
          maxLength: 200
        quantity:
          type: integer
          minimum: 1
        confidence:
          type: number
          minimum: 0
          maximum: 1
        review_status:
          type: string
          enum: [auto_accepted, pending_review, accepted, rejected]
        lot_id:
          type: [string, 'null']
          format: uuid
          description: Ідентифікатор чернетки лота; `null`, доки позицію не прийнято.

    RecognitionJob:
      type: object
      required: [id, status, attempts, error_code, items, created_at, finished_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RecognitionJobStatus'
        attempts:
          type: integer
          minimum: 0
          maximum: 4
        error_code:
          type: [string, 'null']
          description: |
            Заповнюється лише для статусу `failed`: `TENANT_MISMATCH`, `IMAGE_MISSING`, `IMAGE_CORRUPT`,
            `VISION_REJECTED`, `SCHEMA_INVALID`, `EMPTY_RESULT`, `RETRIES_EXHAUSTED`.
          enum: [TENANT_MISMATCH, IMAGE_MISSING, IMAGE_CORRUPT, VISION_REJECTED, SCHEMA_INVALID, EMPTY_RESULT, RETRIES_EXHAUSTED, null]
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecognitionItem'
        created_at:
          type: string
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time

    ReviewRequest:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [accept, reject]
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Виправлена назва; допускається лише для `accept`.
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
          description: Виправлена кількість; допускається лише для `accept`.

    VenueLotStatus:
      type: string
      description: Статус лота закладу; `draft` не передається в B2C-фід.
      enum: [draft, active, sold_out, withdrawn]

    VenueLot:
      type: object
      required:
        - id
        - menu_item_id
        - name
        - description
        - base_price_minor
        - currency
        - quantity
        - pickup_from
        - pickup_to
        - allergens
        - is_bundle
        - bundle_items
        - status
        - version
        - published_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        menu_item_id:
          type: [string, 'null']
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 1000
        base_price_minor:
          type: integer
          minimum: 1
        currency:
          $ref: '#/components/schemas/Currency'
        quantity:
          type: integer
          minimum: 0
        pickup_from:
          type: string
          format: date-time
        pickup_to:
          type: string
          format: date-time
        allergens:
          $ref: '#/components/schemas/Allergens'
        is_bundle:
          type: boolean
        bundle_items:
          type: array
          items:
            $ref: '#/components/schemas/BundleItem'
        status:
          $ref: '#/components/schemas/VenueLotStatus'
        version:
          type: integer
          minimum: 1
          description: Номер версії для оптимістичного блокування.
        published_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VenueLotsPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VenueLot'
        next_cursor:
          type: [string, 'null']

    CreateLotRequest:
      type: object
      required: [name, base_price_minor, quantity, pickup_from, pickup_to]
      additionalProperties: false
      properties:
        menu_item_id:
          type: [string, 'null']
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 1000
        base_price_minor:
          type: integer
          minimum: 1
          maximum: 10000000
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
        pickup_from:
          type: string
          format: date-time
        pickup_to:
          type: string
          format: date-time
          description: Пізніше за `pickup_from`.
        allergens:
          $ref: '#/components/schemas/Allergens'
        bundle_items:
          type: array
          description: Склад смарт-бандла (від 2 до 3 позицій); якщо задано, лот має `is_bundle` = true.
          minItems: 2
          maxItems: 3
          items:
            $ref: '#/components/schemas/BundleItem'
      example:
        name: Круасан з маслом
        base_price_minor: 4500
        quantity: 5
        pickup_from: '2026-11-10T19:00:00+02:00'
        pickup_to: '2026-11-10T21:00:00+02:00'
        allergens: [gluten, milk, eggs]

    UpdateLotRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
          description: Версія лота, на якій ґрунтується зміна.
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 1000
        base_price_minor:
          type: integer
          minimum: 1
          maximum: 10000000
        quantity:
          type: integer
          minimum: 0
          maximum: 100000
        pickup_from:
          type: string
          format: date-time
        pickup_to:
          type: string
          format: date-time
        allergens:
          $ref: '#/components/schemas/Allergens'

    RedeemRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Токен зі сканованого QR-коду; base64url від 256 біт.

    Redemption:
      type: object
      required: [order_id, confirmation_code, lot_name, quantity, redeemed_at]
      properties:
        order_id:
          type: string
          format: uuid
        confirmation_code:
          type: string
        lot_name:
          type: string
        quantity:
          type: integer
          minimum: 1
        redeemed_at:
          type: string
          format: date-time

    AnalyticsSummary:
      type: object
      required: [period, from, to, recovered_revenue_minor, saved_items_count, currency, generated_at, cached]
      properties:
        period:
          type: string
          enum: [day, week, month]
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        recovered_revenue_minor:
          type: integer
          minimum: 0
          description: Сума `quantity × unit_price_minor` за підтвердженими замовленнями періоду, у копійках.
        saved_items_count:
          type: integer
          minimum: 0
          description: Сума `quantity` за підтвердженими замовленнями періоду.
        currency:
          $ref: '#/components/schemas/Currency'
        generated_at:
          type: string
          format: date-time
        cached:
          type: boolean

    SalesTrend:
      type: object
      required: [from, to, currency, points]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        currency:
          $ref: '#/components/schemas/Currency'
        points:
          type: array
          maxItems: 90
          items:
            type: object
            required: [date, revenue_minor, items_count]
            properties:
              date:
                type: string
                format: date
              revenue_minor:
                type: integer
                minimum: 0
              items_count:
                type: integer
                minimum: 0

    Currency:
      type: string
      enum: [UAH]
      description: Код валюти ISO 4217.

    Venue:
      type: object
      description: '[ДО УЗГОДЖЕННЯ з B2C-модулем] Заклад, що продає лот.'
      x-agreement-status: pending
      required: [id, name, address, location]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        address:
          type: string
          maxLength: 300
        location:
          $ref: '#/components/schemas/GeoPoint'

    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180

    BundleItem:
      type: object
      description: '[ДО УЗГОДЖЕННЯ з B2C-модулем] Позиція всередині смарт-бандла.'
      x-agreement-status: pending
      required: [name, quantity]
      properties:
        name:
          type: string
          maxLength: 200
        quantity:
          type: integer
          minimum: 1

    LotStatus:
      type: string
      description: |
        - `active` — доступний для покупки.
        - `sold_out` — залишок 0.
        - `withdrawn` — заклад зняв лот з продажу (вручну або через списання в POS).
      enum: [active, sold_out, withdrawn]

    Lot:
      type: object
      description: |
        [ДО УЗГОДЖЕННЯ з B2C-модулем] Лот закладу. Смарт-бандл — теж один лот
        (`is_bundle: true`), склад описано в `bundle_items`; `quantity` —
        кількість бандлів.
      x-agreement-status: pending
      required:
        - id
        - venue
        - name
        - base_price_minor
        - currency
        - quantity
        - pickup_from
        - pickup_to
        - allergens
        - is_bundle
        - status
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        venue:
          $ref: '#/components/schemas/Venue'
        name:
          type: string
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 1000
        category:
          type: [string, 'null']
          maxLength: 100
          description: |
            [ДО УЗГОДЖЕННЯ з B2C-модулем] Назва категорії позиції меню, з якої створено лот.
            Категорії кожен заклад називає сам, тому назви в різних закладів можуть
            відрізнятися. `null` — для смарт-бандлів і лотів без позиції меню.
          x-agreement-status: pending
        base_price_minor:
          type: integer
          minimum: 1
          description: Базова ціна за одиницю в копійках. B2C-модуль рахує від неї динамічну ціну.
        currency:
          $ref: '#/components/schemas/Currency'
        quantity:
          type: integer
          minimum: 0
          description: Доступний залишок одиниць на момент `updated_at`.
        pickup_from:
          type: string
          format: date-time
          description: Початок часу, коли клієнт може забрати замовлення.
        pickup_to:
          type: string
          format: date-time
          description: Кінець часу видачі.
        allergens:
          type: array
          description: Алергени для маркування (порожній масив — алергенів не виявлено).
          items:
            type: string
        photo_url:
          type: [string, 'null']
          format: uri
          description: Публічне посилання на фото лота.
        is_bundle:
          type: boolean
        bundle_items:
          type: array
          description: Склад бандла; порожній, якщо `is_bundle` = false.
          items:
            $ref: '#/components/schemas/BundleItem'
        status:
          $ref: '#/components/schemas/LotStatus'
        updated_at:
          type: string
          format: date-time

    LotsFeedPage:
      type: object
      required: [items, next_cursor, server_time]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Lot'
        next_cursor:
          type: [string, 'null']
          description: Курсор наступної сторінки; null — це остання сторінка.
        server_time:
          type: string
          format: date-time
          description: Час сервера B2B; передати як `updated_since` у наступному опитуванні.

    OrderConfirmationRequest:
      type: object
      required: [order_id, lot_id, quantity, unit_price_minor, currency, purchased_at]
      properties:
        order_id:
          type: string
          format: uuid
          description: Номер замовлення в системі B2C-модуля; ключ ідемпотентності.
        lot_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          description: '[ДО УЗГОДЖЕННЯ з B2C-модулем] Кількість одиниць (або бандлів).'
          x-agreement-status: pending
        unit_price_minor:
          type: integer
          minimum: 0
          description: |
            [ДО УЗГОДЖЕННЯ з B2C-модулем] Ціна за одиницю в копійках після динамічного
            ціноутворення (Price Decay) на боці B2C-модуля. Може бути меншою за
            `base_price_minor` лота.
          x-agreement-status: pending
        currency:
          $ref: '#/components/schemas/Currency'
        purchased_at:
          type: string
          format: date-time
          description: Момент оплати або автовикупу в системі B2C-модуля.

    OrderConfirmation:
      type: object
      required: [order_id, lot_id, quantity, status, confirmation_code, remaining_quantity, qr_path]
      properties:
        order_id:
          type: string
          format: uuid
        lot_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [confirmed]
        confirmation_code:
          type: string
          description: Короткий текстовий код для перевірки касиром.
        remaining_quantity:
          type: integer
          minimum: 0
          description: Залишок лота після цієї покупки.
        qr_path:
          type: string
          description: Шлях, за яким отримати QR (крок 5).

    OrderQr:
      type: object
      required: [order_id, confirmation_code, status, qr_image, pickup_from, pickup_to, venue]
      properties:
        order_id:
          type: string
          format: uuid
        confirmation_code:
          type: string
          description: |
            Короткий код для візуальної звірки касиром. Не є вмістом QR-коду й не приймається для погашення;
            QR-код містить токен довжиною 256 біт, який приймає `POST /v1/venue/redemptions`.
        status:
          type: string
          description: |
            - `awaiting_pickup` — клієнт ще не забрав замовлення.
            - `picked_up` — касир підтвердив видачу.
          enum: [awaiting_pickup, picked_up]
        qr_image:
          type: object
          required: [mime_type, data_base64]
          properties:
            mime_type:
              type: string
              enum: [image/png]
            data_base64:
              type: string
              contentEncoding: base64
        pickup_from:
          type: string
          format: date-time
        pickup_to:
          type: string
          format: date-time
        venue:
          $ref: '#/components/schemas/Venue'

    Health:
      type: object
      required: [status, version, time]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        time:
          type: string
          format: date-time

