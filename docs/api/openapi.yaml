openapi: 3.1.0
info:
  title: B2B API системи автоматизації продажів і розпізнавання інвентарю
  version: 1.0.0
  summary: Контракт REST API B2B-системи закладу харчування.
  description: |
    Єдина специфікація інтерфейсів B2B API (контейнер «B2B API» діаграми C4 рівня 2) для двох груп споживачів:

    | Споживач | Префікс шляхів | Автентифікація |
    | --- | --- | --- |
    | Мобільний застосунок персоналу (React Native) | `/v1/auth/*`, `/v1/venue/*` | JWT Bearer (`BearerAuth`) |
    | B2C-модуль маркетплейсу | `/v1/lots/*`, `/v1/orders/*` | API-ключ у заголовку `X-API-Key` (`ApiKeyAuth`) |
    | Docker Compose, моніторинг | `/v1/health` | Не потрібна |

    Службовий endpoint `/metrics` (Prometheus) не входить до цього контракту: він доступний лише у внутрішній мережі контейнерів і не проксіюється Nginx.

    Ендпоінти B2C-модуля (`/v1/lots/feed`, `/v1/lots/{lotId}`, `/v1/orders`, `/v1/orders/{orderId}/qr`, `/v1/health`) збігаються з узгодженим контрактом `contracts/b2c-contract.yaml`; відмінності: розширено перелік кодів помилок, додано відповіді `429` і `503`, уточнено вміст QR-коду.

    **Загальні правила.**
    - Гроші — цілі числа в копійках (`*_minor`), валюта `UAH`.
    - Час — ISO 8601 із часовою зоною; ідентифікатори — UUID.
    - Усі помилки мають єдиний формат `Error` (`code`, `message`, `details`).
    - Кожна відповідь містить заголовок `X-Correlation-Id`; значення із запиту зберігається, за його відсутності генерується сервером.
    - Ліміт запитів — 100 за хвилину на ключ (ідентифікатор користувача або API-ключ); перевищення дає `429` із заголовком `Retry-After`.
    - Ресурси закладу ідентифікуються за `venue_id` з JWT. Звернення до ресурсу іншого закладу дає `404`; виклик операції, недоступної ролі, дає `403`.
    - Роль `cashier` не має доступу до змін меню й категорій, облікових записів та аналітики; операції читання меню й категорій доступні обом ролям.

    **Автентифікація персоналу.** Access-токен JWT (RS256, строк дії не більше 15 хв) передається в заголовку `Authorization: Bearer <token>`. Refresh-токен діє не більше 7 діб і замінюється при кожному використанні; повторне використання замінного токена відкликає весь ланцюг токенів.

    **Відповідність статусів замовлення.** Внутрішній статус `confirmed` подається в `OrderQr.status` як `awaiting_pickup`, статус `redeemed` — як `picked_up`.
  license:
    name: Academic use only (qualification project)
    url: https://github.com/MariiaHutsuliak/f2-diploma-project
  x-agreement-status: pending
servers:
  - url: '{baseUrl}'
    description: Базова адреса B2B API (за зворотним проксі Nginx, TLS 1.3).
    variables:
      baseUrl:
        default: http://localhost:3000
        description: Значення змінної середовища `B2B_BASE_URL`.
security:
  - BearerAuth: []
tags:
  - name: Auth
    description: Автентифікація персоналу.
  - name: Staff
    description: Облікові записи касирів (роль `admin`).
  - name: Catalog
    description: Категорії та позиції меню.
  - name: Recognition
    description: Розпізнавання зображень і формування чернеток лотів.
  - name: Venue lots
    description: Лоти закладу для мобільного застосунку.
  - name: Redemptions
    description: Погашення QR-кодів.
  - name: Analytics
    description: Фінансова аналітика закладу (роль `admin`).
  - name: Lots
    description: Лоти для B2C-модуля.
  - name: Orders
    description: Підтвердження покупок і видача QR-кодів для B2C-модуля.
  - name: System
    description: Службові виклики.

paths:
  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Вхід за логіном і паролем
      description: |
        Повертає пару JWT. Після 5 послідовних невдалих спроб обліковий запис блокується на 15 хв; у цей період
        навіть правильний пароль дає `423 ACCOUNT_LOCKED`. Відповідь на неправильний логін і неправильний пароль
        однакова (`401 INVALID_CREDENTIALS`), щоб не розкривати наявність облікового запису.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: cashier.anna
              password: correct-horse-battery
      responses:
        '200':
          description: Автентифікацію виконано.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Невірний логін або пароль.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_CREDENTIALS
                message: Invalid login or password.
        '423':
          description: Обліковий запис заблоковано через послідовні невдалі спроби входу.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ACCOUNT_LOCKED
                message: Account is locked after repeated failed attempts.
                details:
                  locked_until: '2026-11-10T19:15:00+02:00'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: Оновлення пари токенів
      description: |
        Замінює refresh-токен новим. Використаний раніше (замінений) токен відхиляється, а всі токени його ланцюга
        відкликаються.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Нову пару токенів видано.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Refresh-токен недійсний, прострочений, відкликаний або вже використаний.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_REFRESH_TOKEN
                message: Refresh token is invalid or has been used.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/venue/staff:
    get:
      tags: [Staff]
      operationId: listStaff
      summary: Перелік облікових записів закладу
      description: 'Роль: `admin`.'
      x-required-roles: [admin]
      parameters:
        - name: is_active
          in: query
          required: false
          description: Фільтр за ознакою активності.
          schema:
            type: boolean
      responses:
        '200':
          description: Облікові записи закладу.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Staff'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Staff]
      operationId: createCashier
      summary: Створення облікового запису касира
      description: 'Роль: `admin`. Створюється обліковий запис із роллю `cashier` у закладі адміністратора.'
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCashierRequest'
      responses:
        '201':
          description: Обліковий запис створено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Логін уже використовується.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: LOGIN_TAKEN
                message: Login is already in use.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/venue/staff/{staffId}:
    patch:
      tags: [Staff]
      operationId: updateStaffActivity
      summary: Активація або деактивація облікового запису
      description: |
        Роль: `admin`. Деактивація відкликає всі refresh-токени облікового запису; вхід у деактивований обліковий
        запис дає `401 INVALID_CREDENTIALS`.
      x-required-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/StaffId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              additionalProperties: false
              properties:
                is_active:
                  type: boolean
            example:
              is_active: false
      responses:
        '200':
          description: Обліковий запис оновлено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/venue/staff/{staffId}/anonymize:
    post:
      tags: [Staff]
      operationId: anonymizeStaff
      summary: Знеособлення облікового запису за запитом суб'єкта даних
      description: |
        Роль: `admin`. Замінює `login` і пароль випадковими значеннями, встановлює `anonymized_at`, деактивує обліковий
        запис і відкликає його refresh-токени (стаття 17 GDPR). Записи журналу видач зберігаються із посиланням
        на знеособлений обліковий запис. Операцію виконують не пізніше 30 діб після запиту суб'єкта даних.
      x-required-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/StaffId'
      responses:
        '204':
          description: Обліковий запис знеособлено.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/venue/categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: Перелік категорій закладу
      description: 'Роль: `admin` або `cashier`.'
      responses:
        '200':
          description: Категорії закладу.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Catalog]
      operationId: createCategory
      summary: Створення категорії
      description: 'Роль: `admin`.'
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Категорію створено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/CategoryNameTaken'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/venue/categories/{categoryId}:
    patch:
      tags: [Catalog]
      operationId: updateCategory
      summary: Зміна назви категорії
      description: 'Роль: `admin`.'
      x-required-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Категорію оновлено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CategoryNameTaken'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Catalog]
      operationId: deleteCategory
      summary: Видалення категорії
      description: 'Роль: `admin`. Категорію з позиціями меню видалити не можна.'
      x-required-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '204':
          description: Категорію видалено.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Категорія містить позиції меню.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: CATEGORY_NOT_EMPTY
                message: Category contains menu items.
                details:
                  menu_items_count: 3
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/venue/category-pairs:
    get:
      tags: [Catalog]
      operationId: listCategoryPairs
      summary: Довідник сумісних категорій для смарт-бандлів
      description: 'Роль: `admin` або `cashier`.'
      responses:
        '200':
          description: Пари категорій закладу.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPairs'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Catalog]
      operationId: replaceCategoryPairs
      summary: Заміна довідника сумісних категорій
      description: |
        Роль: `admin`. Передана множина пар замінює поточну; пари `(A, B)` і `(B, A)` вважаються однією парою.
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryPairs'
      responses:
        '200':
          description: Довідник замінено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPairs'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/venue/menu-items:
    get:
      tags: [Catalog]
      operationId: listMenuItems
      summary: Перелік позицій меню
      description: 'Роль: `admin` або `cashier`.'
      parameters:
        - name: category_id
          in: query
          required: false
          description: Фільтр за категорією.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Позиції меню закладу.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Catalog]
      operationId: createMenuItem
      summary: Створення позиції меню
      description: 'Роль: `admin`.'
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemInput'
      responses:
        '201':
          description: Позицію створено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/venue/menu-items/{menuItemId}:
    get:
      tags: [Catalog]
      operationId: getMenuItem
      summary: Позиція меню за ідентифікатором
      description: 'Роль: `admin` або `cashier`.'
      parameters:
        - $ref: '#/components/parameters/MenuItemId'
      responses:
        '200':
          description: Позицію знайдено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Catalog]
      operationId: updateMenuItem
      summary: Зміна позиції меню
      description: 'Роль: `admin`. Передаються лише змінювані поля.'
      x-required-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/MenuItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemPatch'
      responses:
        '200':
          description: Позицію оновлено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Catalog]
      operationId: deleteMenuItem
      summary: Видалення позиції меню
      description: 'Роль: `admin`. У лотів, створених із позиції, поле `menu_item_id` отримує значення `null`.'
      x-required-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/MenuItemId'
      responses:
        '204':
          description: Позицію видалено.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/venue/recognition-jobs:
    post:
      tags: [Recognition]
      operationId: createRecognitionJob
      summary: Приймання зображення на розпізнавання
      description: |
        Роль: `admin` або `cashier`. Зображення JPEG або PNG розміром до 10 МБ зберігається в об'єктному сховищі,
        завдання ставиться в чергу BullMQ, відповідь `202` повертається без очікування Vision API.
        Вміст файлу перевіряється за сигнатурою, а не за заголовком `Content-Type`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
