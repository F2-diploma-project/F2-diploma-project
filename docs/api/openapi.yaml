        Роль: `admin` або `cashier`. Перевірка та погашення токена виконуються однією атомарною операцією: із двох
        одночасних запитів із тим самим токеном успішним є лише один. Токен іншого закладу дає `404 TOKEN_NOT_FOUND`
        без розкриття факту його існування. Порядок перевірок: формат, наявність і належність закладу, повторне
