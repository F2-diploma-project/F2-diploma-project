  # --- Ендпоінти B2C-модуля (узгоджений контракт b2c-contract.yaml) ---
  /v1/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Перевірка доступності B2B-системи
      description: |
        [ДО УЗГОДЖЕННЯ з B2C-модулем] Використовується спільним docker-compose
        і інтеграційним тестом, щоб дочекатися запуску B2B-бекенду.
        Не потребує API-ключа.
      x-agreement-status: pending
      security: []
      responses:
        '200':
          description: Система працює.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                version: 0.1.0
                time: '2026-10-10T18:30:00+03:00'
        '503':
          description: Система запущена, але залежність (БД або Redis) недоступна.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: degraded
                version: 0.1.0
                time: '2026-10-10T18:30:00+03:00'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/lots/feed:
    get:
      tags: [Lots]
      operationId: getLotsFeed
      security:
        - ApiKeyAuth: []
      summary: Фід нових і оновлених лотів (крок 1)
      description: |
        [ДО УЗГОДЖЕННЯ з B2C-модулем] B2C-модуль сама періодично (рекомендовано раз на
        30 секунд) забирає лоти, створені або змінені після `updated_since`.

        У фід потрапляють також лоти, що стали недоступними (`sold_out`,
        `withdrawn`), щоб B2C-модуль прибрала їх із показу.

        Як читати фід:
        1. Перший запит — без `updated_since` (усі активні лоти).
        2. Якщо у відповіді є `next_cursor` — повторити запит з `cursor`.
        3. Коли `next_cursor` = null — зберегти `server_time` і наступного разу
           передати його як `updated_since`.

        Значення `server_time` зменшено на 5 с відносно годинника сервера: лот, зафіксований паралельною транзакцією
        з незначним запізненням, потрапляє в наступну вибірку. B2C-модуль обробляє повторно отримані лоти
        ідемпотентно за `id` і `updated_at`.

        Базова ціна (`base_price_minor`) — вхідні дані для ціноутворення B2C-модуля;
        B2B її не змінює після публікації без оновлення лота у фіді.

        Опитування фіду — це обмін між бекендами. Оновлення лотів кінцевим
        клієнтам B2C-модуль транслює сам, через власний WebSocket-канал; у цьому
        контракті такого виклику немає.
      x-agreement-status: pending
      parameters:
        - name: updated_since
          in: query
          required: false
          description: Повернути лоти, змінені строго після цього моменту.
          schema:
            type: string
            format: date-time
          example: '2026-10-10T18:00:00+03:00'
        - name: cursor
          in: query
          required: false
          description: Непрозорий курсор наступної сторінки з попередньої відповіді.
          schema:
            type: string
          example: eyJvZmZzZXQiOjEwMH0
        - name: limit
          in: query
          required: false
          description: Кількість лотів на сторінці.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: Сторінка фіду.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotsFeedPage'
              examples:
                withLots:
                  summary: Звичайний лот, смарт-бандл і лот магазину
                  value:
                    items:
                      - id: 3f2b8c1e-9a4d-4e7b-b1c2-5d6e7f8a9b0c
                        venue:
                          id: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                          name: Кав'ярня «Ранок»
                          address: Київ, вул. Хрещатик, 10
                          location:
                            lat: 50.4475
                            lng: 30.5222
                        name: Круасан з маслом
                        description: Свіжа випічка сьогоднішнього дня.
                        category: Випічка
                        base_price_minor: 4500
